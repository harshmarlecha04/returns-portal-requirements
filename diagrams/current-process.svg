<rect x="6.0" y="43.0" width="122" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="67.0" y="65.4" text-anchor="middle" font-size="10" fill="#000">Emails or phones their</text>
<text x="67.0" y="77.4" text-anchor="middle" font-size="10" fill="#000">sales rep</text>
<rect x="140.0" y="115.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="201.0" y="137.4" text-anchor="middle" font-size="10" fill="#000">Emails back a PDF</text>
<text x="201.0" y="149.4" text-anchor="middle" font-size="10" fill="#000">return form</text>
<rect x="6.0" y="187.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="67.0" y="209.4" text-anchor="middle" font-size="10" fill="#000">Fills in the form and</text>
<text x="67.0" y="221.4" text-anchor="middle" font-size="10" fill="#000">emails it back</text>
<circle cx="124.0" cy="187.0" r="9" fill="#1433ff"/><text x="124.0" y="190.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P1</text>
<rect x="140.0" y="259.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="201.0" y="281.4" text-anchor="middle" font-size="10" fill="#000">Retypes it into the</text>
<text x="201.0" y="293.4" text-anchor="middle" font-size="10" fill="#000">shared spreadsheet</text>
<circle cx="258.0" cy="259.0" r="9" fill="#1433ff"/><text x="258.0" y="262.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P1</text>
<rect x="274.0" y="331.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="335.0" y="353.4" text-anchor="middle" font-size="10" fill="#000">Reads the form, checks</text>
<text x="335.0" y="365.4" text-anchor="middle" font-size="10" fill="#000">policy from memory</text>
<circle cx="392.0" cy="331.0" r="9" fill="#1433ff"/><text x="392.0" y="334.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P6</text>
<circle cx="371.0" cy="331.0" r="9" fill="#1433ff"/><text x="371.0" y="334.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P2</text>
<rect x="140.0" y="403.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="201.0" y="425.4" text-anchor="middle" font-size="10" fill="#000">Emails the RMA number</text>
<text x="201.0" y="437.4" text-anchor="middle" font-size="10" fill="#000">to the customer</text>
<rect x="6.0" y="475.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="67.0" y="497.4" text-anchor="middle" font-size="10" fill="#000">Writes the RMA on the</text>
<text x="67.0" y="509.4" text-anchor="middle" font-size="10" fill="#000">box and ships</text>
<circle cx="124.0" cy="475.0" r="9" fill="#1433ff"/><text x="124.0" y="478.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P3</text>
<rect x="408.0" y="547.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="469.0" y="563.4" text-anchor="middle" font-size="10" fill="#000">Inspects, writes the</text>
<text x="469.0" y="575.4" text-anchor="middle" font-size="10" fill="#000">result on the packing</text>
<text x="469.0" y="587.4" text-anchor="middle" font-size="10" fill="#000">slip</text>
<circle cx="526.0" cy="547.0" r="9" fill="#1433ff"/><text x="526.0" y="550.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P4</text>
<rect x="274.0" y="619.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="335.0" y="641.4" text-anchor="middle" font-size="10" fill="#000">Retypes the result</text>
<text x="335.0" y="653.4" text-anchor="middle" font-size="10" fill="#000">into an email to AR</text>
<circle cx="392.0" cy="619.0" r="9" fill="#1433ff"/><text x="392.0" y="622.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P4</text>
<rect x="542.0" y="691.0" width="122" height="50" rx="7" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="603.0" y="713.4" text-anchor="middle" font-size="10" fill="#000">Keys the credit memo</text>
<text x="603.0" y="725.4" text-anchor="middle" font-size="10" fill="#000">into the ERP</text>
<circle cx="660.0" cy="691.0" r="9" fill="#1433ff"/><text x="660.0" y="694.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P1</text>
<rect x="6.0" y="763.0" width="122" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="2.4"/>
<text x="67.0" y="785.4" text-anchor="middle" font-size="10" fill="#000">Gets a credit. Median</text>
<text x="67.0" y="797.4" text-anchor="middle" font-size="10" fill="#000">11 business days</text>
<circle cx="124.0" cy="763.0" r="9" fill="#1433ff"/><text x="124.0" y="766.0" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">P5</text>
